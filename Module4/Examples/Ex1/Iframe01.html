<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de iFrame</title>
</head>
<style>
    iframe {
        width: 400px;
        height: 400px;
        border: 1px solid black;
    }
</style>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>
        Acessando o site do
        <!--
            Tamanho padrao do iframe 300(w)x150(H)
            scolling = auto/yes/no
        --> 
        <iframe src="https://www.cursoemvideo.com" frameborder="1" height="500" scolling="yes"></iframe> 
        <a href="https://www.cursoemvideo.com" target="_blank"></a>
        o para aprender a programar.
    </p>
    <p>
        O site do 
        <iframe src="https://www.google.com.mz" frameborder="0"></iframe> 
        é muito legal, pena que não funciona dentro do iframe
    </p>
    <p>
        Repositório do Guanabara 
        <iframe src="https://gustavoguanabara.github.io" frameborder="0" width="500" height="500"></iframe> 
        <a href="https://gustavoguanabara.github.io" target="_blank"></a>
        também é bem legal
    </p>
</body>
</html>
