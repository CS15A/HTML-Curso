<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <h1>Meu primeiro formulário</h1>
    <!-- 
        autocomplete - para lembrar os dados 
        name - para java/php
        id - para javascript/label
        ctrl + shift + p - para envelopar(emmet: wrap...)
        method - get(não oculta dados do formulário, e torna o link compartilhável, limite: 3.000 letras) / post(oculta dados do formulário na url) - para dados sensíveis(senhas, fotos, etc)
    -->
    <form action="cadastro.php" autocomplete="off" method="post">
        <p><label for="inome">Nome:</label> <input type="text" name="nome" id="inome"></p>
        <p><label for="isobrenome">Sobrenome:</label> <input type="text" name="sobrenome" id="isobrenome"></p>
        <p><input type="submit" value="Enviar"></p>
    </form>
</body>
</html>
